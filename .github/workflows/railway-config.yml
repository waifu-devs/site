name: Railway config

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".railway/**"

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: railwayapp/config@v1
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
      # The CDN and edge rules railway.ts can't declare yet (.railway/edge.mjs): what
      # merging would change. Changes nothing.
      - run: node .railway/edge.mjs check web,api,analytics
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: railwayapp/config@v1
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
      # After the config apply, so it never moves the environment under a pinned plan.
      - run: node .railway/edge.mjs apply web,api,analytics
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
